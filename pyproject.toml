[project]
name = "desk-bike"
version = "0.1.0"
description = "Record casual pedaling on an under-desk exercise bike from a BLE cadence sensor"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
]

[project.scripts]
desk-bike = "desk_bike.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["desk_bike"]
