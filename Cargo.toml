[package]
name = "desk-bike"
version = "0.2.0"
edition = "2024"
description = "Record casual pedaling on an under-desk exercise bike from a BLE cadence sensor"

[profile.release]
strip = true

[dependencies]
anyhow = "1"
btleplug = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
uuid = "1"

[dev-dependencies]
tempfile = "3"
